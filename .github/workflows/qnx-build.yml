name: QNX Build

# CI dédiée QNX 8.0 : tourne UNIQUEMENT sur le runner auto-hébergé de ce PC
# (label `qnx`, seul endroit où le SDP QNX est licencié). Jamais sur les
# runners hébergés (pas de SDP là-bas).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qnx-build:
    # `self-hosted` + `glane-qnx` : le label DEDIE au dépôt. Le label `qnx`
    # seul ne suffit pas — il est aussi porté par le runner d'organisation
    # `pc-qnx` (hébergé sur le r630), qui a le SDP QNX mais PAS QEMU : le job
    # y échouait sur « qemu-system-x86_64 : commande introuvable », alors que
    # le runner du dépôt (pc-qnx-repo, sur le poste qui a QEMU) était libre.
    runs-on: [self-hosted, glane-qnx]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compile glaned + socle core/ pour QNX 8.0
        run: bash qnx/build.sh

      - name: Preuve d'exécution (IFS + QEMU + capture, < 5 min)
        run: bash qnx/run-glane-qemu.sh